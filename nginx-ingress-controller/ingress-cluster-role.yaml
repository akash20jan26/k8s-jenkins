kind: ClusterRole
apiVersion: rbac.authorization.k8s.io/v1
metadata:
  name: nginx-ingress-clusterrole
  labels:
    app: ingress-controller
rules:
  - apiGroups:
      - ""
    resources:
      - endpoints
      - nodes
      - pods
      - secrets
      - services
      - namespaces
      - configmaps
    verbs: 
      - list
      - watch
      - get
  - apiGroups:
    - coordination.k8s.io
    resources:
    - leases
    verbs:
    - get
    - list
    - watch
    - create
    - update
    - patch
  - apiGroups:
    - discovery.k8s.io
    resources:
    - endpointslices
    verbs:
    - get
    - list
    - watch
  - apiGroups: ["networking.k8s.io"]
    resources:
    - ingresses
    - ingressclasses
    verbs: ["get","list","watch"]

  - apiGroups: ["networking.k8s.io"]
    resources:
    - ingresses/status
    verbs: ["update"]

  - apiGroups: [""]
    resources:
    - events
    verbs: ["create","patch"]
